<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<title>Blends &amp; Beyond Weather</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Outfit:wght@500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --sky-day-top:#cfe4ee;
    --sky-day-bot:#eaf2f5;
    --sky-night-top:#0d1b2a;
    --sky-night-bot:#182a3c;
    --ink:#16232e;
    --ink-soft:#4a5b68;
    --ink-faint:#8a99a3;
    --paper:#f4f7f8;
    --line:#c7d3d8;
    --accent:#2f6fa8;
    --amber:#c98a2b;
    --alert:#b5482b;
    --sun:#e9b64f;
    --cloud:#ffffff;
    --cloud-op:0.55;
    --clock-color:#1e6fd9;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{
    width:100%; height:100%;
    background:var(--sky-day-bot);
    font-family:'Space Grotesk', sans-serif;
    color:var(--ink);
    overflow:hidden;
  }
  body{
    display:flex;
    align-items:stretch;
    justify-content:stretch;
  }
  #stage{
    position:relative;
    width:100%;
    height:100vh;
    background:linear-gradient(var(--sky-day-top), var(--sky-day-bot));
    transition:background 1.2s ease;
    display:flex;
    flex-direction:column;
    justify-content:space-between;
    padding:4vh 4vw;
    overflow:hidden;
    border:2px solid rgba(22,35,46,0.14);
    outline:1.4vh solid var(--sky-day-bot);
    outline-offset:-1.4vh;
  }
  body.night #stage{ outline-color:var(--sky-night-bot); border-color:rgba(255,255,255,0.14); }
  .rivet{
    position:absolute; width:0.9vh; height:0.9vh; border-radius:50%;
    background:rgba(22,35,46,0.18); z-index:2;
  }
  body.night .rivet{ background:rgba(255,255,255,0.22); }
  .rivet.tl{ top:1.6vh; left:1.6vh; } .rivet.tr{ top:1.6vh; right:1.6vh; }
  .rivet.bl{ bottom:1.6vh; left:1.6vh; } .rivet.br{ bottom:1.6vh; right:1.6vh; }
  body.night #stage{ background:linear-gradient(var(--sky-night-top), var(--sky-night-bot)); }
  body.night{ color:#eef3f6; }
  body.night .ink-soft{ color:#a9bac6 !important; }
  body.night .stroke{ stroke:rgba(255,255,255,0.5) !important; }
  body.night{ --clock-color:#5fa8ff; }

  #scene{ position:absolute; inset:0; z-index:0; }
  @keyframes steamRise{
    0%{ transform:translate(0,0) scale(0.85); opacity:0; }
    15%{ opacity:0.55; }
    50%{ transform:translate(7px,-32px) scale(1); opacity:0.4; }
    85%{ opacity:0.12; }
    100%{ transform:translate(-5px,-64px) scale(1.2); opacity:0; }
  }
  .steam-wisp{ animation:steamRise 4.5s ease-in-out infinite; transform-origin:center bottom; }
  @keyframes driftSlow{ from{ transform:translateX(-15px); } to{ transform:translateX(15px); } }
  @keyframes driftMed{ from{ transform:translateX(-25px); } to{ transform:translateX(20px); } }
  @keyframes driftFast{ from{ transform:translateX(-35px); } to{ transform:translateX(30px); } }
  .drift-slow{ animation:driftSlow 40s ease-in-out infinite alternate; }
  .drift-med{ animation:driftMed 28s ease-in-out infinite alternate; }
  .drift-fast{ animation:driftFast 18s ease-in-out infinite alternate; }
  @keyframes twinkle{ 0%,100%{ opacity:0.25; } 50%{ opacity:0.9; } }
  .star-twinkle{ animation:twinkle 3.5s ease-in-out infinite; }
  .star-twinkle-slow{ animation:twinkle 6s ease-in-out infinite; }
  @keyframes sunPulse{ 0%,100%{ opacity:0.95; } 50%{ opacity:0.8; } }
  .sun-pulse{ animation:sunPulse 6s ease-in-out infinite; transform-origin:830px 460px; }
  @keyframes rayRotate{ from{ transform:rotate(0deg); } to{ transform:rotate(360deg); } }
  .sun-ray{ transform-origin:830px 460px; }
  @keyframes rainFall{ 0%{ opacity:0; } 15%{ opacity:0.5; } 100%{ opacity:0; transform:translateY(20px); } }
  .rain-drop{ animation:rainFall 0.7s linear infinite; }
  @keyframes snowFall{ 0%{ transform:translateY(0) translateX(0); } 50%{ transform:translateY(20px) translateX(8px); } 100%{ transform:translateY(40px) translateX(0); } }
  .snow-drift{ animation:snowFall 6s ease-in-out infinite; }
  @keyframes boltFlash{ 0%,88%,100%{ opacity:0.15; } 90%,94%{ opacity:1; } }
  .bolt-flash{ animation:boltFlash 4s ease-in-out infinite; }

  .row{ position:relative; z-index:1; display:flex; }
  .top-row{ justify-content:space-between; align-items:flex-start; }
  .headline-row{ align-items:flex-end; gap:5vw; margin-top:2vh; }

  .clockbox{ text-align:right; position:absolute; top:3vh; right:0; white-space:nowrap; z-index:1; display:flex; flex-direction:column; gap:0.5vh; }
  .clock-time{ font-size:13vh; font-weight:600; line-height:0.85; color:var(--clock-color); letter-spacing:-1px; font-family:'Outfit', sans-serif; }
  .clock-day{ font-size:6vh; font-weight:500; line-height:0.95; color:var(--clock-color); letter-spacing:-1px; }
  .clock-date{ font-size:4vh; font-weight:500; line-height:0.95; color:var(--clock-color); letter-spacing:-1px; }

  .eyebrow{ font-family:'JetBrains Mono', monospace; font-size:2.1vh; letter-spacing:3px; text-transform:uppercase; color:var(--ink-faint); margin-bottom:1vh; display:flex; align-items:center; gap:0.8vw; }
  .eyebrow .dash{ width:2.2vw; height:1px; background:var(--ink-faint); display:inline-block; }
  .temp-block{ position:relative; z-index:2; background:rgba(255,255,255,0.55); border-radius:10px; padding:1.8vh 2.5vw; width:fit-content; }
  body.night .temp-block{ background:rgba(10,20,30,0.85); }
  .temp-block .label{ font-size:2.6vh; text-transform:uppercase; letter-spacing:2px; color:var(--ink-soft); font-weight:500; margin-bottom:0.5vh; }
  .temp-value{ font-size:22vh; font-weight:600; line-height:0.85; position:relative; display:inline-block; letter-spacing:-1px; font-family:'Outfit', sans-serif; }
  .temp-value sup{ font-size:0.32em; font-weight:400; color:var(--ink-soft); vertical-align:super; }
  .high{ font-size:5vh; color:var(--ink-soft); font-weight:500; font-family:'JetBrains Mono', monospace; white-space:nowrap; }
  .high b{ color:var(--ink); font-weight:600; font-family:'Outfit', sans-serif; }
  .high sup{ font-size:0.5em; font-weight:400; color:var(--ink-soft); }
  body.night .high b{ color:#eef3f6; }

  .outlook-row{ display:flex; gap:1.8vw; margin-top:1.5vh; }
  .outlook-item{ display:flex; flex-direction:column; align-items:center; gap:0.5vh; }
  .outlook-item .oi-hour{ font-family:'JetBrains Mono', monospace; font-size:2.4vh; color:var(--ink-faint); }
  .outlook-item .oi-temp{ font-family:'Outfit', sans-serif; font-size:3vh; font-weight:600; color:var(--ink); }
  body.night .outlook-item .oi-temp{ color:#eef3f6; }
  .outlook-item svg{ width:6.5vh; height:6.5vh; display:block; }

  .stat-col{ display:flex; flex-direction:column; gap:1.8vh; margin-top:2vh; width:72vh; background:rgba(255,255,255,0.55); border-radius:10px; padding:2vh 2.5vw; position:relative; z-index:2; }
  body.night .stat-col{ background:rgba(0,0,0,0.28); }

  .arrivals-panel{ margin-top:2vh; background:rgba(255,255,255,0.55); border-radius:10px; padding:1.6vh 2vw; position:relative; z-index:2; text-align:right; width:fit-content; margin-left:auto; }
  body.night .arrivals-panel{ background:rgba(0,0,0,0.28); }
  .arrivals-title{ font-family:'JetBrains Mono', monospace; font-size:2.4vh; text-transform:uppercase; letter-spacing:2px; color:var(--ink-soft); font-weight:500; margin-bottom:1.2vh; text-align:center; }
  .arrivals-cols{ display:flex; gap:2.5vw; justify-content:flex-end; }
  .arrivals-col{ flex:none; }
  .arrivals-col .ac-dest{ font-size:2.6vh; color:var(--ink-soft); font-weight:500; margin-bottom:0.8vh; }
  .arrivals-col .ac-times{ display:flex; gap:1vw; flex-wrap:wrap; justify-content:flex-end; }
  .arrivals-col .ac-time{ font-family:'Outfit', sans-serif; font-size:7.5vh; font-weight:600; color:var(--ink); }
  body.night .arrivals-col .ac-time{ color:#eef3f6; }
  .arrivals-col .ac-time sup{ font-size:0.32em; font-weight:400; color:var(--ink-faint); }
  .stat{ display:flex; align-items:center; justify-content:space-between; gap:1vw; font-size:6vh; color:var(--ink-soft); font-weight:500; white-space:nowrap; padding-bottom:1.8vh; border-bottom:1px solid var(--line); }
  .stat .stat-label{ display:flex; align-items:center; gap:0.8vw; }
  .stat:last-child{ border-bottom:none; padding-bottom:0; }
  .stat b{ color:var(--ink); font-weight:600; font-family:'Outfit', sans-serif; text-align:right; }
  body.night .stat b{ color:#eef3f6; }
  body.night .stat{ border-bottom-color:rgba(255,255,255,0.14); }

  #tfl{
    display:flex;
    align-items:flex-start;
    gap:1vw;
    background:rgba(197,110,43,0.14);
    border:1px solid var(--alert);
    border-radius:8px;
    padding:1.6vh 2vw;
    max-width:62vh;
    opacity:0;
    visibility:hidden;
    transition:opacity 0.4s ease;
    position:relative;
    z-index:2;
  }
  #tfl.show{ opacity:1; visibility:visible; }
  #tfl .dot{ width:2.2vh; height:2.2vh; border-radius:50%; background:var(--alert); flex:none; margin-top:0.6vh; }
  #tfl-text{ font-size:2.4vh; font-weight:500; color:var(--alert); line-height:1.3; }

  .footer{ font-family:'JetBrains Mono', monospace; font-size:1.9vh; letter-spacing:1px; color:var(--ink-faint); text-align:center; margin-top:1vh; z-index:1; position:relative; display:flex; align-items:center; justify-content:center; gap:0.8vw; }
  #logo{ width:6vh; height:6vh; border-radius:50%; opacity:0.9; }

  #offscreen{
    position:fixed; inset:0; background:#000; z-index:50;
    display:none;
  }
  #offscreen.show{ display:block; }
</style>
</head>

<script>
/* ---------- CONFIG ---------- */
const LAT = 51.6478, LON = -0.1322; // Oakwood, London N14
const ON_HOUR = 7, OFF_HOUR = 23; // display active 07:00–22:59
const REFRESH_MS = 10 * 60 * 1000; // 10 minutes
const ARRIVALS_REFRESH_MS = 60 * 1000; // 1 minute

/* ---------- SCREEN ON/OFF WINDOW ---------- */
function applyScreenWindow(){
  const h = new Date().getHours();
  // Active 07:00–23:59, off 00:00–06:59 (OFF_HOUR = 0 means "off resumes at midnight")
  const isOn = OFF_HOUR === 0 ? (h >= ON_HOUR) : (h >= ON_HOUR && h < OFF_HOUR);
  document.getElementById('offscreen').classList.toggle('show', !isOn);
}
setInterval(applyScreenWindow, 30 * 1000);
applyScreenWindow();

/* ---------- CLOCK / DATE (both shown together) ---------- */
const dayNames = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const fullDayNames = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const monthNames = ['January','February','March','April','May','June','July','August','September','October','November','December'];
function ordinal(n){
  const s = ['th','st','nd','rd'], v = n % 100;
  return n + (s[(v-20)%10] || s[v] || s[0]);
}
function renderClock(){
  const now = new Date();
  let hh = now.getHours().toString().padStart(2,'0');
  let mm = now.getMinutes().toString().padStart(2,'0');
  document.getElementById('clock-time').textContent = `${hh}:${mm}`;
  document.getElementById('clock-day').textContent = fullDayNames[now.getDay()];
  document.getElementById('clock-date').textContent =
    `${ordinal(now.getDate())} ${monthNames[now.getMonth()]}`;
  const isNight = now.getHours() >= 20 || now.getHours() < 7;
  document.body.classList.toggle('night', isNight);
}
setInterval(renderClock, 1000 * 15);
renderClock();

/* ---------- SKY SCENE ---------- */
function renderScene(weatherCode, isNight){
  const scene = document.getElementById('scene');
  const thunder = [95,96,99].includes(weatherCode);
  const snow = [71,73,75,77,85,86].includes(weatherCode);
  const fog = [45,48].includes(weatherCode);
  const rainy = !snow && !thunder && [51,53,55,56,57,61,63,65,66,67,80,81,82].includes(weatherCode);
  const cloudy = [1,2,3].includes(weatherCode) || fog || rainy || snow || thunder;

  // coffee cup geometry — the weather "brews" above the rim, like steam
  const cupCX = 830, rimY = 380, baseY = 560, halfTop = 105, halfBottom = 85;
  const sx = cupCX, sy = 250; // sun/moon anchor, now sitting just above the cup

  let svg = '';

  /* ---- coffee cup illustration (static, drawn first so weather sits above/behind it correctly) ---- */
  // saucer
  svg += `<ellipse cx="${cupCX}" cy="${baseY+16}" rx="150" ry="16" fill="#c9d6dc" opacity="${isNight?0.18:0.35}"/>`;
  // handle (drawn before the body so the body's fill covers the inner half, leaving a clean "D" shape)
  svg += `<ellipse cx="${cupCX+halfTop+38}" cy="${(rimY+baseY)/2}" rx="42" ry="58" fill="none" stroke="#caa47a" stroke-width="16" opacity="${isNight?0.55:0.9}"/>`;
  // cup body (flat trapezoid taper)
  svg += `<polygon points="${cupCX-halfTop},${rimY} ${cupCX+halfTop},${rimY} ${cupCX+halfBottom},${baseY} ${cupCX-halfBottom},${baseY}" fill="#f3ebdd" opacity="${isNight?0.5:0.92}"/>`;
  // coffee surface at the rim
  svg += `<ellipse cx="${cupCX}" cy="${rimY}" rx="${halfTop}" ry="16" fill="#5a3a26" opacity="${isNight?0.6:0.9}"/>`;
  svg += `<ellipse cx="${cupCX-25}" cy="${rimY-3}" rx="30" ry="7" fill="#8a6142" opacity="${isNight?0.4:0.6}"/>`;

  /* ---- weather cluster, above the cup ---- */
  if(!isNight){
    svg += `<circle cx="${sx}" cy="${sy}" r="80" fill="var(--sun)" opacity="${cloudy?0.06:0.12}"/>`;
    svg += `<circle cx="${sx}" cy="${sy}" r="64" fill="var(--sun)" opacity="${cloudy?0.08:0.16}"/>`;
    if(!cloudy){
      for(let i=0;i<12;i++){
        const a = (i/12) * Math.PI * 2;
        const r1 = 55, r2 = 72;
        const x1 = sx + Math.cos(a)*r1, y1 = sy + Math.sin(a)*r1;
        const x2 = sx + Math.cos(a)*r2, y2 = sy + Math.sin(a)*r2;
        svg += `<line x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}" stroke="var(--sun)" stroke-width="2.5" opacity="0.35" class="sun-ray"/>`;
      }
    }
    svg += `<circle cx="${sx}" cy="${sy}" r="46" fill="var(--sun)" opacity="${cloudy ? 0.55 : 0.95}" class="sun-pulse"/>`;
  } else {
    svg += `<circle cx="${sx}" cy="${sy}" r="38" fill="#eef3f6" opacity="0.12"/>`;
    svg += `<circle cx="${sx-6}" cy="${sy-4}" r="30" fill="#eef3f6" opacity="0.9"/>`;
    svg += `<circle cx="${sx+7}" cy="${sy-7}" r="26" fill="var(--sky-night-bot)" opacity="0.55"/>`;
    for(let i=0;i<16;i++){
      const x = cupCX - 150 + (i*19)%300, y = 100 + (i*31)%150;
      const r = i%6===0 ? 2.2 : 1.1;
      const cls = i%6===0 ? 'star-twinkle-slow' : (i%3===0 ? 'star-twinkle' : '');
      svg += `<circle cx="${x}" cy="${y}" r="${r}" fill="#ffffff" opacity="${0.3+(i%5)*0.12}" class="${cls}"/>`;
    }
  }

  if(cloudy){
    const cloudOp = thunder ? 0.8 : 0.6;
    const cloudFill = thunder ? '#5a6b78' : '#ffffff';
    const shadeFill = thunder ? '#3f4a54' : '#c9d6dc';
    const clouds = [
      {cx:cupCX-70, cy:220, s:0.5, speed:'drift-slow'},
      {cx:cupCX+55, cy:200, s:0.38, speed:'drift-med'},
      {cx:cupCX-10, cy:255, s:0.56, speed:'drift-fast'}
    ];
    clouds.forEach(c=>{
      const rx = 140*c.s, ry = 50*c.s;
      svg += `<g class="${c.speed}">`;
      svg += `<ellipse cx="${c.cx+6}" cy="${c.cy+8}" rx="${rx}" ry="${ry}" fill="${shadeFill}" opacity="${cloudOp*0.5}"/>`;
      svg += `<ellipse cx="${c.cx}" cy="${c.cy}" rx="${rx}" ry="${ry}" fill="${cloudFill}" opacity="${cloudOp}"/>`;
      svg += `<ellipse cx="${c.cx-rx*0.45}" cy="${c.cy+ry*0.25}" rx="${rx*0.5}" ry="${ry*0.7}" fill="${cloudFill}" opacity="${cloudOp}"/>`;
      svg += `<ellipse cx="${c.cx+rx*0.5}" cy="${c.cy+ry*0.15}" rx="${rx*0.4}" ry="${ry*0.6}" fill="${cloudFill}" opacity="${cloudOp}"/>`;
      svg += `<ellipse cx="${c.cx-rx*0.15}" cy="${c.cy-ry*0.35}" rx="${rx*0.4}" ry="${ry*0.5}" fill="${cloudFill}" opacity="${cloudOp*0.9}"/>`;
      svg += `</g>`;
    });
  }

  if(rainy){
    for(let i=0;i<12;i++){
      const x = cupCX - 90 + (i*17)%180, len = 18+(i%4)*6, delay=(i%5)*0.15;
      const y0 = 300;
      svg += `<line x1="${x}" y1="${y0}" x2="${x-7}" y2="${y0+len}" stroke="var(--accent)" stroke-width="2" opacity="0.45" class="rain-drop" style="animation-delay:${delay}s"/>`;
    }
  }

  if(snow){
    for(let i=0;i<18;i++){
      const x = cupCX - 100 + (i*23)%200, y = 220 + (i*17)%140, r = 1.6 + (i%3), delay=(i%6)*0.4;
      svg += `<circle cx="${x}" cy="${y}" r="${r}" fill="#ffffff" opacity="0.8" class="snow-drift" style="animation-delay:${delay}s"/>`;
    }
  }

  if(fog){
    for(let i=0;i<3;i++){
      const y = 300 + i*22;
      svg += `<rect x="${cupCX-140}" y="${y}" width="280" height="16" rx="8" fill="#dfe7ea" opacity="0.5" class="${i%2===0?'drift-slow':'drift-med'}"/>`;
    }
  }

  if(thunder){
    svg += `<polyline points="${cupCX+10},150 ${cupCX-15},210 ${cupCX+12},210 ${cupCX-12},270" fill="none" stroke="var(--sun)" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" opacity="0.9" class="bolt-flash"/>`;
  }

  /* ---- rising steam, always present regardless of weather ---- */
  const steamColor = isNight ? '#dfe7ea' : '#ffffff';
  const wisps = [
    { dx:-22, delay:0,    height:70 },
    { dx:0,   delay:1.5,  height:80 },
    { dx:20,  delay:3.0,  height:65 }
  ];
  wisps.forEach(w => {
    const bx = cupCX + w.dx, by = rimY - 8;
    const path = `M${bx-8},${by} C${bx-16},${by-w.height*0.4} ${bx+4},${by-w.height*0.6} ${bx-6},${by-w.height}`;
    svg += `<path d="${path}" fill="none" stroke="${steamColor}" stroke-width="6" stroke-linecap="round" opacity="0.5" class="steam-wisp" style="animation-delay:${w.delay}s"/>`;
  });

  scene.innerHTML = svg;
}


/* ---------- COMPACT WEATHER ICON (for the 6-hour outlook row) ---------- */
function weatherIconSVG(code, isNight, precipProb){
  const thunder = [95,96,99].includes(code);
  const snowCode = [71,73,75,77,85,86].includes(code);
  const fog = [45,48].includes(code);
  let rainy = !snowCode && !thunder && [51,53,55,56,57,61,63,65,66,67,80,81,82].includes(code);
  let cloudy = [1,2,3].includes(code) || fog || rainy || snowCode || thunder;
  const snow = snowCode;
  // let the actual rain-probability number override a mismatched weather_code,
  // so the icon never contradicts the percentage shown next to it
  if(typeof precipProb === 'number'){
    if(precipProb >= 30){ rainy = true; cloudy = true; }
    else if(precipProb >= 15){ cloudy = true; }
  }
  let s = '';
  if(!isNight){
    s += `<circle cx="12" cy="10" r="5" fill="var(--sun)" opacity="${cloudy?0.5:0.95}"/>`;
  } else {
    s += `<circle cx="12" cy="10" r="4.5" fill="#dfe7ee" stroke="var(--ink-faint)" stroke-width="0.7"/>`;
  }
  if(cloudy){
    s += `<ellipse cx="11" cy="14.5" rx="8" ry="3.6" fill="#ffffff" stroke="var(--ink-faint)" stroke-width="0.6"/>`;
    s += `<ellipse cx="7" cy="13.5" rx="4" ry="2.6" fill="#ffffff" stroke="var(--ink-faint)" stroke-width="0.6"/>`;
  }
  if(rainy){
    s += `<line x1="8" y1="19" x2="6.5" y2="24" stroke="#1e6fd9" stroke-width="2" stroke-linecap="round"/>`;
    s += `<line x1="12" y1="19" x2="10.5" y2="24" stroke="#1e6fd9" stroke-width="2" stroke-linecap="round"/>`;
    s += `<line x1="16" y1="19" x2="14.5" y2="24" stroke="#1e6fd9" stroke-width="2" stroke-linecap="round"/>`;
  }
  if(snow){
    s += `<circle cx="8" cy="21" r="1.3" fill="#6a7d88"/>`;
    s += `<circle cx="12" cy="23" r="1.3" fill="#6a7d88"/>`;
    s += `<circle cx="16" cy="21" r="1.3" fill="#6a7d88"/>`;
  }
  if(fog){
    s += `<line x1="3" y1="19" x2="21" y2="19" stroke="#6a7d88" stroke-width="1.6" opacity="0.7"/>`;
    s += `<line x1="5" y1="22" x2="19" y2="22" stroke="#6a7d88" stroke-width="1.6" opacity="0.7"/>`;
  }
  if(thunder){
    s += `<polyline points="12,17 10,21 13,21 11,24" fill="none" stroke="#c98a2b" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/>`;
  }
  return `<svg viewBox="0 0 24 26">${s}</svg>`;
}

function renderOutlook(times, codes, startIdx, precipProbs, temps){
  const row = document.getElementById('outlook-row');
  if(!times || !codes){ row.innerHTML=''; return; }
  let html = '';
  for(let i=startIdx; i<Math.min(startIdx+6, times.length); i++){
    const t = new Date(times[i]);
    const hh = t.getHours();
    const label = hh.toString().padStart(2,'0')+':00';
    const isNight = hh >= 20 || hh < 7;
    const pp = precipProbs ? precipProbs[i] : undefined;
    const tempStr = (temps && typeof temps[i] === 'number') ? `${Math.round(temps[i])}&deg;` : '';
    html += `<div class="outlook-item">${weatherIconSVG(codes[i], isNight, pp)}<span class="oi-temp">${tempStr}</span><span class="oi-hour">${label}</span></div>`;
  }
  row.innerHTML = html;
}

function beaufortForce(kt){
  const thresholds = [1,4,7,11,17,22,28,34,41,48,56,64]; // upper bound (kt) for forces 0-11
  for(let f=0; f<thresholds.length; f++){
    if(kt < thresholds[f]) return f;
  }
  return 12;
}

/* ---------- DATA FETCH: OPEN-METEO ---------- */
async function updateWeather(){
  try{
    const url = `https://api.open-meteo.com/v1/forecast?latitude=${LAT}&longitude=${LON}` +
      `&current=temperature_2m,relative_humidity_2m,weather_code,wind_speed_10m,wind_direction_10m` +
      `&hourly=precipitation_probability,weather_code,temperature_2m` +
      `&daily=temperature_2m_max&forecast_hours=6&timezone=Europe%2FLondon&wind_speed_unit=kn`;
    const res = await fetch(url);
    const data = await res.json();

    const temp = Math.round(data.current.temperature_2m * 10) / 10;
    document.getElementById('temp-val').innerHTML = `${temp}<sup>&deg;C</sup>`;

    const high = Math.round(data.daily.temperature_2m_max[0]);
    document.getElementById('temp-high').innerHTML = `Max temp <b>${high}<sup>&deg;C</sup></b>`;

    document.getElementById('humidity-val').textContent = `${Math.round(data.current.relative_humidity_2m)}%`;

    const windSpeed = Math.round(data.current.wind_speed_10m);
    const windDir = data.current.wind_direction_10m;
    document.getElementById('wind-val').textContent = `${windSpeed} kt (F${beaufortForce(windSpeed)})`;
    // wind_direction is where the wind blows FROM; rotate the arrow to point where it blows TO
    const windScale = 0.7 + Math.min(windSpeed, 35) / 35 * 1.1; // ~0.7x at calm, ~1.8x at 35kt+
    document.getElementById('wind-arrow').style.transform =
      `rotate(${(windDir + 180) % 360}deg) scale(${windScale.toFixed(2)})`;

    // rain probability for the current/next hour
    const now = new Date();
    const pad = n => n.toString().padStart(2,'0');
    const nowLocal = `${now.getFullYear()}-${pad(now.getMonth()+1)}-${pad(now.getDate())}T${pad(now.getHours())}`;
    let rainIdx = data.hourly.time.findIndex(t => t.startsWith(nowLocal));
    if(rainIdx === -1) rainIdx = 0;
    const rainProb = data.hourly.precipitation_probability[rainIdx];
    document.getElementById('rain-val').textContent = `${rainProb ?? 0}%`;

    const isNight = new Date().getHours() >= 20 || new Date().getHours() < 7;
    renderScene(data.current.weather_code, isNight);
    renderOutlook(data.hourly.time, data.hourly.weather_code, rainIdx, data.hourly.precipitation_probability, data.hourly.temperature_2m);
  } catch(err){
    console.error('Weather fetch failed', err);
  }
}

/* ---------- DATA FETCH: TFL PICCADILLY LINE ---------- */
/* ---------- OAKWOOD STATION ARRIVALS (TfL Unified API, free, no key) ---------- */
async function updateArrivals(){
  const col = document.getElementById('arrivals-cols');
  try{
    const res = await fetch('https://api.tfl.gov.uk/StopPoint/940GZZLUOAK/Arrivals');
    if(!res.ok) throw new Error('Arrivals fetch failed: ' + res.status);
    const data = await res.json();
    const preds = (Array.isArray(data) ? data : [])
      .filter(p => (p.lineId || '').toLowerCase() === 'piccadilly')
      .sort((a,b) => a.timeToStation - b.timeToStation);

    const groups = { outbound: [], inbound: [] };
    preds.forEach(p => {
      const dir = (p.direction || '').toLowerCase();
      if(groups[dir]) groups[dir].push(p);
    });

    function renderGroup(label, list){
      const times = list.slice(0, 2).map(p => {
        const mins = Math.round(p.timeToStation / 60);
        return `<span class="ac-time">${mins <= 0 ? 'Due' : mins}${mins > 0 ? '<sup>min</sup>' : ''}</span>`;
      }).join('');
      return `<div class="arrivals-col">
        <div class="ac-dest">${label}</div>
        <div class="ac-times">${times || '<span class="ac-time" style="font-size:2.2vh; color:var(--ink-faint);">No data</span>'}</div>
      </div>`;
    }

    col.innerHTML =
      renderGroup('Towards Cockfosters', groups.outbound) +
      renderGroup('Towards Central London', groups.inbound);
  } catch(err){
    console.error('Arrivals fetch failed', err);
  }
}

async function updateTfl(){
  try{
    const res = await fetch('https://api.tfl.gov.uk/Line/piccadilly/Status?detail=true');
    const data = await res.json();
    const statuses = data[0]?.lineStatuses || [];
    const active = statuses.find(s => s.statusSeverityDescription !== 'Good Service');
    const box = document.getElementById('tfl');
    if(active){
      document.getElementById('tfl-text').textContent = active.reason || `Piccadilly Line: ${active.statusSeverityDescription}`;
      box.classList.add('show');
    } else {
      box.classList.remove('show');
    }
  } catch(err){
    console.error('TfL fetch failed', err);
  }
}

/* ---------- BOOT ---------- */
function refreshAll(){ updateWeather(); updateTfl(); updateArrivals(); }
refreshAll();
setInterval(refreshAll, REFRESH_MS);
setInterval(updateArrivals, ARRIVALS_REFRESH_MS);
</script>
